openapi: 3.0.3
info:
  title: PetCare API
  version: 1.0.0
  description: API REST inicial com Express, JWT e MongoDB
servers:
  - url: http://localhost:3000/api
tags:
  - name: Health
  - name: Auth
  - name: Pets
paths:
  /health:
    get:
      tags: [Health]
      summary: Verifica se a API está online
      responses:
        "200":
          description: API saudável
  /protected:
    get:
      tags: [Health]
      summary: Rota protegida de exemplo
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Acesso autorizado
        "401":
          description: Não autorizado
  /register:
    post:
      tags: [Auth]
      summary: Registra um novo usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  example: Maria
                email:
                  type: string
                  format: email
                  example: maria@email.com
                password:
                  type: string
                  format: password
                  example: "123456"
      responses:
        "201":
          description: Usuário criado
        "409":
          description: Usuário já existe
  /login:
    post:
      tags: [Auth]
      summary: Autentica um usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: maria@email.com
                password:
                  type: string
                  format: password
                  example: "123456"
      responses:
        "200":
          description: Login realizado com sucesso
        "401":
          description: Credenciais inválidas
  /pets/{petId}:
    get:
      tags: [Pets]
      summary: Consulta os dados de um pet do tutor autenticado
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: petId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pet encontrado
        "403":
          description: Pet pertence a outro tutor
        "404":
          description: Pet não encontrado
        "401":
          description: Não autenticado
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
